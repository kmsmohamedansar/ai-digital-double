 width='10' height='10' rx='2' fill='#00798c'/><text x='314' y='402' font-size='11'>best likeness, wrong format</text><rect x='499.4' y='393' width='10' height='10' rx='2' fill='#30a46c'/><text x='513.4' y='402' font-size='11'>shipped</text></svg>