<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 456' width='760' height='456' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><style>text{fill:#57606a} .t{fill:#24292f;font-weight:600}@media (prefers-color-scheme: dark){text{fill:#9aa4ae} .t{fill:#e6edf3} .g{stroke:#30363d}}</style><text class='t' x='20' y='26' font-size='16'>Eleven stages in one day, 09:35–14:42</text><line class='g' x1='335.0' x2='335.0' y1='40' y2='376' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='335.0' y='394' font-size='11' text-anchor='middle'>10:00</text><line class='g' x1='419.1' x2='419.1' y1='40' y2='376' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='419.1' y='394' font-size='11' text-anchor='middle'>11:00</text><line class='g' x1='503.1' x2='503.1' y1='40' y2='376' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='503.1' y='394' font-size='11' text-anchor='middle'>12:00</text><line class='g' x1='587.1' x2='587.1' y1='40' y2='376' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='587.1' y='394' font-size='11' text-anchor='middle'>13:00</text><line class='g' x1='671.2' x2='671.2' y1='40' y2='376' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='671.2' y='394' font-size='11' text-anchor='middle'>14:00</text><text x='290' y='63' font-size='12' text-anchor='end'>1. Head built purely from code</text><rect x='300.0' y='51' width='14.0' height='20' rx='3' fill='#d1495b'><title>Head built purely from code: dead end</title></rect><text x='290' y='93' font-size='12' text-anchor='end'>2. KeenTools FaceBuilder from 3 photos</text><rect x='316.8' y='81' width='12.6' height='20' rx='3' fill='#edae49'><title>KeenTools FaceBuilder from 3 photos: partial</title></rect><text x='290' y='123' font-size='12' text-anchor='end'>3. Particle-system hair</text><rect x='330.8' y='111' width='8.4' height='20' rx='3' fill='#d1495b'><title>Particle-system hair: dead end</title></rect><text x='290' y='153' font-size='12' text-anchor='end'>4. FaceBuilder from 8 video frames</text><rect x='342.0' y='141' width='11.2' height='20' rx='3' fill='#edae49'><title>FaceBuilder from 8 video frames: partial</title></rect><text x='290' y='183' font-size='12' text-anchor='end'>5. Apple Object Capture from the video</text><rect x='347.6' y='171' width='11.2' height='20' rx='3' fill='#8d6cc8'><title>Apple Object Capture from the video: useful as measurement</title></rect><text x='290' y='213' font-size='12' text-anchor='end'>6. Strand hair grown into the measured volume</text><rect x='360.2' y='201' width='18.2' height='20' rx='3' fill='#d1495b'><title>Strand hair grown into the measured volume: dead end</title></rect><text x='290' y='243' font-size='12' text-anchor='end'>7. Full-resolution photo set</text><rect x='405.0' y='231' width='14.0' height='20' rx='3' fill='#d1495b'><title>Full-resolution photo set: dead end</title></rect><text x='290' y='273' font-size='12' text-anchor='end'>8. Gaussian splat trained on-device</text><rect x='461.1' y='261' width='123.3' height='20' rx='3' fill='#00798c'><title>Gaussian splat trained on-device: best likeness, wrong format</title></rect><text x='290' y='303' font-size='12' text-anchor='end'>9. Final model: real eyes, hair, web export</text><rect x='601.1' y='291' width='49.0' height='20' rx='3' fill='#30a46c'><title>Final model: real eyes, hair, web export: shipped</title></rect><text x='290' y='333' font-size='12' text-anchor='end'>10. Fixes from my review: eyes, temples, neck</text><rect x='653.0' y='321' width='46.2' height='20' rx='3' fill='#30a46c'><title>Fixes from my review: eyes, temples, neck: shipped</title></rect><text x='290' y='363' font-size='12' text-anchor='end'>11. Second review: hair, eyes, polo</text><rect x='706.2' y='351' width='23.8' height='20' rx='3' fill='#30a46c'><title>Second review: hair, eyes, polo: shipped</title></rect><rect x='300' y='405' width='10' height='10' rx='2' fill='#d1495b'/><text x='314' y='414' font-size='11'>dead end</text><rect x='381.6' y='405' width='10' height='10' rx='2' fill='#edae49'/><text x='395.6' y='414' font-size='11'>partial</text><rect x='457.0' y='405' width='10' height='10' rx='2' fill='#8d6cc8'/><text x='471.0' y='414' font-size='11'>useful as measurement</text><rect x='300' y='423' width='10' height='10' rx='2' fill='#00798c'/><text x='314' y='432' font-size='11'>best likeness, wrong format</text><rect x='499.4' y='423' width='10' height='10' rx='2' fill='#30a46c'/><text x='513.4' y='432' font-size='11'>shipped</text></svg>