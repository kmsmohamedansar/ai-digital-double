<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 396' width='760' height='396' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><style>text{fill:#57606a} .t{fill:#24292f;font-weight:600}@media (prefers-color-scheme: dark){text{fill:#9aa4ae} .t{fill:#e6edf3} .g{stroke:#30363d}}</style><text class='t' x='20' y='26' font-size='16'>Nine approaches in one day, 09:35–13:45</text><line class='g' x1='343.0' x2='343.0' y1='40' y2='316' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='343.0' y='334' font-size='11' text-anchor='middle'>10:00</text><line class='g' x1='446.2' x2='446.2' y1='40' y2='316' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='446.2' y='334' font-size='11' text-anchor='middle'>11:00</text><line class='g' x1='549.4' x2='549.4' y1='40' y2='316' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='549.4' y='334' font-size='11' text-anchor='middle'>12:00</text><line class='g' x1='652.6' x2='652.6' y1='40' y2='316' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='652.6' y='334' font-size='11' text-anchor='middle'>13:00</text><text x='290' y='63' font-size='12' text-anchor='end'>1. Head built purely from code</text><rect x='300.0' y='51' width='17.2' height='20' rx='3' fill='#d1495b'><title>Head built purely from code: dead end</title></rect><text x='290' y='93' font-size='12' text-anchor='end'>2. KeenTools FaceBuilder from 3 photos</text><rect x='320.6' y='81' width='15.5' height='20' rx='3' fill='#edae49'><title>KeenTools FaceBuilder from 3 photos: partial</title></rect><text x='290' y='123' font-size='12' text-anchor='end'>3. Particle-system hair</text><rect x='337.8' y='111' width='10.3' height='20' rx='3' fill='#d1495b'><title>Particle-system hair: dead end</title></rect><text x='290' y='153' font-size='12' text-anchor='end'>4. FaceBuilder from 8 video frames</text><rect x='351.6' y='141' width='13.8' height='20' rx='3' fill='#edae49'><title>FaceBuilder from 8 video frames: partial</title></rect><text x='290' y='183' font-size='12' text-anchor='end'>5. Apple Object Capture from the video</text><rect x='358.5' y='171' width='13.8' height='20' rx='3' fill='#8d6cc8'><title>Apple Object Capture from the video: useful as measurement</title></rect><text x='290' y='213' font-size='12' text-anchor='end'>6. Strand hair grown into the measured volume</text><rect x='374.0' y='201' width='22.4' height='20' rx='3' fill='#d1495b'><title>Strand hair grown into the measured volume: dead end</title></rect><text x='290' y='243' font-size='12' text-anchor='end'>7. Full-resolution photo set</text><rect x='429.0' y='231' width='17.2' height='20' rx='3' fill='#d1495b'><title>Full-resolution photo set: dead end</title></rect><text x='290' y='273' font-size='12' text-anchor='end'>8. Gaussian splat trained on-device</text><rect x='497.8' y='261' width='151.4' height='20' rx='3' fill='#00798c'><title>Gaussian splat trained on-device: best likeness, wrong format</title></rect><text x='290' y='303' font-size='12' text-anchor='end'>9. Final model: real eyes, hair, web export</text><rect x='669.8' y='291' width='60.2' height='20' rx='3' fill='#30a46c'><title>Final model: real eyes, hair, web export: shipped</title></rect><rect x='300' y='345' width='10' height='10' rx='2' fill='#d1495b'/><text x='314' y='354' font-size='11'>dead end</text><rect x='381.6' y='345' width='10' height='10' rx='2' fill='#edae49'/><text x='395.6' y='354' font-size='11'>partial</text><rect x='457.0' y='345' width='10' height='10' rx='2' fill='#8d6cc8'/><text x='471.0' y='354' font-size='11'>useful as measurement</text><rect x='300' y='363' width='10' height='10' rx='2' fill='#00798c'/><text x='314' y='372' font-size='11'>best likeness, wrong format</text><rect x='499.4' y='363' width='10' height='10' rx='2' fill='#30a46c'/><text x='513.4' y='372' font-size='11'>shipped</text></svg>