<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 426' width='760' height='426' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><style>text{fill:#57606a} .t{fill:#24292f;font-weight:600}@media (prefers-color-scheme: dark){text{fill:#9aa4ae} .t{fill:#e6edf3} .g{stroke:#30363d}}</style><text class='t' x='20' y='26' font-size='16'>Ten stages in one day, 09:35–14:20</text><line class='g' x1='337.7' x2='337.7' y1='40' y2='346' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='337.7' y='364' font-size='11' text-anchor='middle'>10:00</text><line class='g' x1='428.2' x2='428.2' y1='40' y2='346' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='428.2' y='364' font-size='11' text-anchor='middle'>11:00</text><line class='g' x1='518.8' x2='518.8' y1='40' y2='346' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='518.8' y='364' font-size='11' text-anchor='middle'>12:00</text><line class='g' x1='609.3' x2='609.3' y1='40' y2='346' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='609.3' y='364' font-size='11' text-anchor='middle'>13:00</text><line class='g' x1='699.8' x2='699.8' y1='40' y2='346' stroke='#d0d7de' stroke-dasharray='3 3'/><text x='699.8' y='364' font-size='11' text-anchor='middle'>14:00</text><text x='290' y='63' font-size='12' text-anchor='end'>1. Head built purely from code</text><rect x='300.0' y='51' width='15.1' height='20' rx='3' fill='#d1495b'><title>Head built purely from code: dead end</title></rect><text x='290' y='93' font-size='12' text-anchor='end'>2. KeenTools FaceBuilder from 3 photos</text><rect x='318.1' y='81' width='13.6' height='20' rx='3' fill='#edae49'><title>KeenTools FaceBuilder from 3 photos: partial</title></rect><text x='290' y='123' font-size='12' text-anchor='end'>3. Particle-system hair</text><rect x='333.2' y='111' width='9.1' height='20' rx='3' fill='#d1495b'><title>Particle-system hair: dead end</title></rect><text x='290' y='153' font-size='12' text-anchor='end'>4. FaceBuilder from 8 video frames</text><rec