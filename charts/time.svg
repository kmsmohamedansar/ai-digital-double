<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 290' width='760' height='290' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif'><style>text{fill:#57606a} .t{fill:#24292f;font-weight:600}@media (prefers-color-scheme: dark){text{fill:#9aa4ae} .t{fill:#e6edf3} .g{stroke:#30363d}}</style><text class='t' x='20' y='26' font-size='16'>Where the time went (3 h 7 min of hands-on work)</text><text x='290' y='59' font-size='12' text-anchor='end'>1. Head built purely from code</text><rect x='300' y='46' width='44.3' height='18' rx='3' fill='#d1495b'/><text x='352.3' y='59' font-size='12'>10 min</text><text x='290' y='85' font-size='12' text-anchor='end'>2. KeenTools FaceBuilder from 3 photos</text><rect x='300' y='72' width='39.9' height='18' rx='3' fill='#edae49'/><text x='347.9' y='85' font-size='12'>9 min</text><text x='290' y='111' font-size='12' text-anchor='end'>3. Particle-system hair</text><rect x='300' y='98' width='26.6' height='18' rx='3' fill='#d1495b'/><text x='334.6' y='111' font-size='12'>6 min</text><text x='290' y='137' font-size='12' text-anchor='end'>4. FaceBuilder from 8 video frames</text><rect x='300' y='124' width='35.5' height='18' rx='3' fill='#edae49'/><text x='343.5' y='137' font-size='12'>8 min</text><text x='290' y='163' font-size='12' text-anchor='end'>5. Apple Object Capture from the video</text><rect x='300' y='150' width='35.5' height='18' rx='3' fill='#8d6cc8'/><text x='343.5' y='163' font-size='12'>8 min</text><text x='290' y='189' font-size='12' text-anchor='end'>6. Strand hair grown into the measured volume</text><rect x='300' y='176' width='57.6' height='18' rx='3' fill='#d1495b'/><text x='365.6' y='189' font-size='12'>13 min</text><text x='290' y='215' font-size='12' text-anchor='end'>7. Full-resolution photo set</text><rect x='300' y='202' width='44.3' height='18' rx='3' fill='#d1495b'/><text x='352.3' y='215' font-size='12'>10 min</text><text x='290' y='241' font-size='12' text-anchor='end'>8. Gaussian splat trained on-device</text><rect x='300' y='228' width='390.0' height='18' rx='3' fill='#00798c'/><text x='698.0' y='241' font-size='12'>88 min</text><text x='290' y='267' font-size='12' text-anchor='end'>9. Final model: real eyes, hair, web export</text><rect x='300' y='254' width='155.1' height='18' rx='3' fill='#30a46c'/><text x='463.1' y='267' font-size='12'>35 min</text></svg>