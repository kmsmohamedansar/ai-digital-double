<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Head Splat</title>
<style>
  :root { --bg: #0b0b0c; --fg: #e8e8e8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; overflow: hidden; }
  #hint { position: fixed; left: 16px; bottom: 16px; opacity: .6; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<div id="hint">Drag to orbit · scroll to zoom</div>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
const viewer = new GaussianSplats3D.Viewer({
  cameraUp: [0, 1, 0],
  initialCameraPosition: [0, 0.05, 0.75],
  initialCameraLookAt: [0, 0, 0],
  sharedMemoryForWorkers: false,
});
viewer.addSplatScene('head.ply', { showLoadingUI: true, progressiveLoad: false })
  .then(() => viewer.start());
</script>
</body>
</html>
